name: Dictalume
options:
  bundleIdPrefix: com.dictalume
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Dictalume:
    type: application
    platform: iOS
    sources:
      - path: Dictalume
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dictalume.app
        INFOPLIST_FILE: Dictalume/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictalume/Dictalume.entitlements
        PRODUCT_NAME: Dictalume
    dependencies:
      - target: DictalumeKeyboard
        embed: true
  DictalumeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: DictalumeKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dictalume.app.keyboard
        INFOPLIST_FILE: DictalumeKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: DictalumeKeyboard/DictalumeKeyboard.entitlements
        PRODUCT_NAME: Dictalume Keyboard
    dependencies: []
schemes:
  Dictalume:
    build:
      targets:
        Dictalume: all
        DictalumeKeyboard: all
    run:
      config: Debug
